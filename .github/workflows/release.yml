name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/check
        id: check
        with:
          tag: ${{ github.ref_name }}
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.check.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.check.outputs.archive }}
          RELEASE_CHECKSUM: ${{ steps.check.outputs.checksum }}
          RELEASE_NOTES: ${{ steps.check.outputs.notes }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'GitHub release already exists; retaining existing assets.'
          else
            flags=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_CHECKSUM" \
              --verify-tag --title "GabbaGuildCraft $RELEASE_VERSION" --notes-file "$RELEASE_NOTES" "${flags[@]}"
          fi
      - name: Upload to CurseForge when configured
        shell: bash
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCHIVE: ${{ steps.check.outputs.archive }}
          RELEASE_NOTES: ${{ steps.check.outputs.notes }}
        run: |
          if [[ -z "$CURSEFORGE_PROJECT_ID" || -z "$CURSEFORGE_API_TOKEN" ]]; then
            echo 'CurseForge upload skipped: both project ID and API token are required.'
            exit 0
          fi
          python tools/upload_curseforge.py --archive "$RELEASE_ARCHIVE" \
            --notes "$RELEASE_NOTES" --tag "$RELEASE_TAG"
